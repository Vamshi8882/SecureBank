server.port=${PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bankdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Local learning environment only. Use Flyway migrations + validate in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
app.jwt.expiration-ms=3600000
app.admin.emails=${ADMIN_EMAILS:}

# Simulated demo credits only. MUST be false outside local development.
app.demo-deposits-enabled=${DEMO_DEPOSITS:true}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
